grumphp:
  process_timeout: 300
  ascii:
    failed: ~
    succeeded: ~
  environment:
    variables:
      XDEBUG_MODE: 'off'
  tasks:
    composer:
      strict: false
    git_blacklist:
      keywords:
        - 'dd('
        - 'dump('
        - 'var_dump('
        - 'print_r('
        - 'ray('
      triggered_by: [ 'php' ]
    pint_staged:
      scripts:
        - [ '-c', 'git diff --cached --name-only --diff-filter=ACMR -z -- "*.php" | xargs -0 -r ./vendor/bin/pint --test' ]
      triggered_by: [ 'php' ]
      metadata:
        task: shell
    pint_all:
      scripts:
        - [ '-c', './vendor/bin/pint --test' ]
      triggered_by: [ 'php' ]
      metadata:
        task: shell
    phpmd:
      whitelist_patterns:
        - /^app\/(.*)/
        - /^database\/(.*)/
        - /^routes\/(.*)/
      ruleset: [ 'phpmd.xml' ]
    phpstan:
      configuration: phpstan.neon
      level: ~
      use_grumphp_paths: true
      triggered_by: [ 'php' ]
      ignore_patterns:
        - /^(?!app\/)/
      memory_limit: '1G'
  testsuites:
    git_pre_commit:
      tasks: [ composer, git_blacklist, pint_staged, phpmd, phpstan ]
    full:
      tasks: [ composer, pint_all, phpmd, phpstan ]
