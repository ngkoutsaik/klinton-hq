# Production stack for Coolify (Docker Compose build pack). MySQL and Gotenberg stay separate Coolify resources;
# the Laravel services join the external `coolify` network to reach them, so point DB_HOST and GOTENBERG_URL at their container names.

x-laravel-env: &laravel-env
    APP_NAME: ${APP_NAME:-Klinton HQ}
    APP_ENV: ${APP_ENV:-production}
    APP_KEY: ${APP_KEY}
    APP_DEBUG: ${APP_DEBUG:-false}
    APP_URL: ${APP_URL}
    LOG_CHANNEL: ${LOG_CHANNEL:-stack}
    LOG_STACK: ${LOG_STACK:-single}
    LOG_LEVEL: ${LOG_LEVEL:-error}
    DB_CONNECTION: ${DB_CONNECTION:-mysql}
    DB_HOST: ${DB_HOST}
    DB_PORT: ${DB_PORT:-3306}
    DB_DATABASE: ${DB_DATABASE}
    DB_USERNAME: ${DB_USERNAME}
    DB_PASSWORD: ${DB_PASSWORD}
    SESSION_DRIVER: ${SESSION_DRIVER:-database}
    QUEUE_CONNECTION: ${QUEUE_CONNECTION:-database}
    CACHE_STORE: ${CACHE_STORE:-database}
    MAIL_MAILER: ${MAIL_MAILER:-smtp}
    MAIL_SCHEME: ${MAIL_SCHEME:-}
    MAIL_HOST: ${MAIL_HOST}
    MAIL_PORT: ${MAIL_PORT}
    MAIL_USERNAME: ${MAIL_USERNAME}
    MAIL_PASSWORD: ${MAIL_PASSWORD}
    MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS}
    MAIL_FROM_NAME: ${MAIL_FROM_NAME:-Klinton HQ}
    LARAVEL_PDF_DRIVER: gotenberg
    GOTENBERG_URL: ${GOTENBERG_URL}
    DEFAULT_ADMIN_EMAIL: ${DEFAULT_ADMIN_EMAIL:-}
    CONTACT_FORM_ENABLED: ${CONTACT_FORM_ENABLED:-false}
    CONTACT_RECIPIENT: ${CONTACT_RECIPIENT:-}
    SENTRY_LARAVEL_DSN: ${SENTRY_LARAVEL_DSN:-}
    SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-1.0}
    SENTRY_PROFILES_SAMPLE_RATE: ${SENTRY_PROFILES_SAMPLE_RATE:-1.0}

x-laravel-networks: &laravel-networks
    - default
    - coolify

services:
    app:
        build:
            context: .
            dockerfile: Dockerfile
        environment:
            <<: *laravel-env
        networks: *laravel-networks

    # Same image as app; AUTORUN is off so only app runs migrations and caches on boot.
    worker:
        build:
            context: .
            dockerfile: Dockerfile
        command: ["php", "/var/www/html/artisan", "queue:work", "--tries=3"]
        stop_signal: SIGTERM
        stop_grace_period: 60s
        environment:
            <<: *laravel-env
            AUTORUN_ENABLED: false
        networks: *laravel-networks
        healthcheck:
            test: ["CMD", "healthcheck-queue"]
            start_period: 10s
        depends_on:
            - app

    scheduler:
        build:
            context: .
            dockerfile: Dockerfile
        command: ["php", "/var/www/html/artisan", "schedule:work"]
        stop_signal: SIGTERM
        environment:
            <<: *laravel-env
            AUTORUN_ENABLED: false
        networks: *laravel-networks
        healthcheck:
            test: ["CMD", "healthcheck-schedule"]
            start_period: 10s
        depends_on:
            - app

networks:
    coolify:
        external: true
